# 提升 dev 版本号、推送 v* 标签或手动触发后，多平台构建并公开发布
name: Release

on:
  push:
    branches: [dev]
    paths:
      - "package.json"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已有版本标签，留空则发布所选分支的 package.json 版本"
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24.x
  CI: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and test release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      sha: ${{ steps.metadata.outputs.sha }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Resolve immutable release version
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v$VERSION"
          REQUESTED_TAG="$INPUT_TAG"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then REQUESTED_TAG="$GITHUB_REF_NAME"; fi
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$RELEASE_TAG" ]; then
            echo "标签 $REQUESTED_TAG 与版本 $RELEASE_TAG 不一致" >&2
            exit 1
          fi
          case "$VERSION" in
            *-alpha|*-alpha.*) CHANNEL=alpha ;;
            *-beta|*-beta.*) CHANNEL=beta ;;
            *-*) echo "只支持正式版或 alpha / beta 预发布版本" >&2; exit 1 ;;
            *) CHANNEL=latest ;;
          esac
          BUILD_SHA="$(git rev-parse HEAD)"
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$TAG_SHA" != "$BUILD_SHA" ]; then
              echo "版本标签已指向其他提交，请提高版本号后重试" >&2
              exit 1
            fi
          fi
          PUBLISH=true
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = "false" ]; then PUBLISH=false; fi
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Remove regional mirrors
        run: rm -f .npmrc
      - name: Install check dependencies
        if: steps.metadata.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format, lint, types and tests
        if: steps.metadata.outputs.publish == 'true'
        run: |
          pnpm prettier --check .
          pnpm lint
          pnpm typecheck
          pnpm test

  build:
    name: Build on ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    timeout-minutes: 90
    env:
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: windows-x64
          - name: Windows arm64
            runner: windows-11-arm
            target: windows-arm64
          - name: macOS x64
            runner: macos-15-intel
            target: macos-x64
          - name: macOS arm64
            runner: macos-latest
            target: macos-arm64
          - name: Linux x64
            runner: ubuntu-latest
            target: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Linux: 安装系统构建/打包依赖
      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev pkg-config clang \
            rpm libarchive-tools

      # 清理旧构建产物
      - name: Clean workspace
        shell: bash
        run: rm -rf dist out

      # CI 不需要国内镜像
      - name: 移除 .npmrc
        shell: bash
        run: rm -f .npmrc

      # 安装项目依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 仅构建本机架构
      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          case "${{ matrix.target }}" in
            windows-x64)
              pnpm build:win --x64 --publish never
              ;;
            windows-arm64)
              pnpm build:win --arm64 --publish never
              ;;
            macos-x64)
              pnpm build:mac --x64 --publish never
              ;;
            macos-arm64)
              pnpm build:mac --arm64 --publish never
              ;;
            linux-x64)
              pnpm build:linux --x64 --publish never
              ;;
            linux-arm64)
              pnpm build:linux --arm64 --publish never
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Next-${{ matrix.name }}
          path: dist/*.*
          if-no-files-found: error
          retention-days: 7

  # 全部构建成功后再发布完整更新清单与安装包
  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      BUILD_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare and verify release assets
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/jsyaml" js-yaml@4.1.0
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node --test .github/scripts/prepare-release-assets.test.cjs
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node .github/scripts/prepare-release-assets.cjs artifacts release-assets "$APP_VERSION"
          cd release-assets
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
      # 先在草稿内上传全部资源，成功后公开；重跑不删除已公开版本
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = "false" ]; then
              echo "该版本已公开发布，请提高版本号，不覆盖现有安装包" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" \
              --title "SPlayer 增强版 $RELEASE_TAG" \
              --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$UPDATE_CHANNEL" = "latest" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          fi
          echo "下载地址：https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
